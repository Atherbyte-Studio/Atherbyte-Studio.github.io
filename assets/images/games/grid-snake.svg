<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A glowing purple snake moving across a dark grid towards a pink dot.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1230"/>
      <stop offset="1" stop-color="#0D0D15"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#885CFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#885CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="food-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#D66BFF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#D66BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#885CFF" stroke-opacity=".16"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <circle cx="440" cy="160" r="190" fill="url(#glow)"/>

  <!-- Snake body: one rounded square per grid cell, getting brighter towards the head -->
  <g fill="#885CFF">
    <rect x="84"  y="284" width="32" height="32" rx="8" fill-opacity=".30"/>
    <rect x="124" y="284" width="32" height="32" rx="8" fill-opacity=".34"/>
    <rect x="164" y="284" width="32" height="32" rx="8" fill-opacity=".38"/>
    <rect x="204" y="284" width="32" height="32" rx="8" fill-opacity=".42"/>
    <rect x="204" y="244" width="32" height="32" rx="8" fill-opacity=".47"/>
    <rect x="204" y="204" width="32" height="32" rx="8" fill-opacity=".52"/>
    <rect x="244" y="204" width="32" height="32" rx="8" fill-opacity=".58"/>
    <rect x="284" y="204" width="32" height="32" rx="8" fill-opacity=".64"/>
    <rect x="324" y="204" width="32" height="32" rx="8" fill-opacity=".70"/>
    <rect x="324" y="164" width="32" height="32" rx="8" fill-opacity=".77"/>
    <rect x="324" y="124" width="32" height="32" rx="8" fill-opacity=".84"/>
    <rect x="364" y="124" width="32" height="32" rx="8" fill-opacity=".92"/>
  </g>

  <!-- Head -->
  <rect x="404" y="124" width="32" height="32" rx="9" fill="#C9B5FF"/>
  <circle cx="427" cy="134" r="3.2" fill="#0B0B0F"/>
  <circle cx="427" cy="146" r="3.2" fill="#0B0B0F"/>

  <!-- Food -->
  <circle cx="540" cy="260" r="34" fill="url(#food-glow)"/>
  <circle cx="540" cy="260" r="11" fill="#D66BFF"/>
</svg>
